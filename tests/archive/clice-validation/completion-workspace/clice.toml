# 测试项目：clice completion-workspace 配置夹具
# 选择 debug/release 子目录的手工编译数据库, 默认 debug.
# 入口: 支持光标标记的历史 clice inspect; 预期配置匹配对应 _DEBUG 分支.
# 本文件是测试输入, 缓存/日志/真正构建输出保留 build; 详细先决条件见 README.md.
default_configuration = "debug"
[[rules]]
configuration = "debug"
compile_commands = ["debug"]
[[rules]]
configuration = "release"
compile_commands = ["release"]