# https://docs.clice.io/zh/clice/guide/configuration
# Paths are relative to this file, not to the workspace root.
# Use the standard test and command-line example build databases.
default_configuration = "debug"

[project]
# Parse opened files even when a header has no cached index/host yet.
# The old readonly="on" PCH workaround left cold headers without AST queries.
readonly = "off"

[[rules]]
configuration = "debug"
compile_commands = ["../build/msvc-debug"]

[[rules]]
configuration = "release"
compile_commands = ["../build/msvc-release"]
