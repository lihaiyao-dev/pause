# https://docs.clice.io/zh/clice/guide/configuration
# Paths are relative to this file, not to the workspace root.
# Qt presets include all examples and supply Qt includes/defines. Keep the
# test databases as a fallback for translation units absent from those presets.
default_configuration = "debug"

[project]
# Parse opened files even when a header has no cached index/host yet.
# The old readonly="on" PCH workaround left cold headers without AST queries.
readonly = "off"

[[rules]]
configuration = "debug"
compile_commands = ["../build/qt-debug", "../build/msvc-debug"]

[[rules]]
configuration = "release"
compile_commands = ["../build/qt-release", "../build/msvc-release"]
